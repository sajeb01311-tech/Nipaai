name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT="$(java -version 2>&1 || true)"
          JAVA_VERSION_STR="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"

          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "::error::Failed to detect active Java version from 'java -version'."
            exit 1
          fi

          if printf '%s' "$JAVA_VERSION_STR" | grep -Eq '^1\.'; then
            JAVA_MAJOR="$(printf '%s' "$JAVA_VERSION_STR" | cut -d. -f2)"
          else
            JAVA_MAJOR="$(printf '%s' "$JAVA_VERSION_STR" | sed -E 's/^([0-9]+).*/\1/')"
          fi

          if ! printf '%s' "$JAVA_MAJOR" | grep -Eq '^[0-9]+$'; then
            echo "::error::Could not parse numeric Java major version from '${JAVA_VERSION_STR}'."
            exit 1
          fi

          echo "Detected active Java major version: ${JAVA_MAJOR} (${JAVA_VERSION_STR})"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool was not found in configured Java 17 installation at ${KEYTOOL_BIN}."
            exit 1
          fi

          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Found existing ./debug.keystore; skipping keystore generation."
          else
            echo "Creating temporary ./debug.keystore with Java 17 keytool..."
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary ./debug.keystore."
              exit 1
            fi
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::./debug.keystore is missing or empty after creation check."
            exit 1
          fi

          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at exact path: ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for any .apk files:"
              FOUND_APKS="$(find app/build/outputs/apk -type f -name '*.apk' | sort || true)"
              if [ -n "$FOUND_APKS" ]; then
                printf '%s\n' "$FOUND_APKS"
              else
                echo "No .apk files found inside app/build/outputs/apk."
              fi
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK at ${EXPECTED_APK} is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::File at ${EXPECTED_APK} does not have a .apk extension."
              exit 1
              ;;
          esac

          APK_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d ' ')"
          echo "Verified debug APK at ${EXPECTED_APK} (${APK_BYTES} bytes)."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Source APK ${SOURCE_APK} is missing or empty."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy release asset to ${ASSET_PATH}."
            exit 1
          fi

          echo "Prepared APK release asset: ${ASSET_FILENAME}"
          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_filename=${ASSET_FILENAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on the runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared APK release asset is missing, not a regular file, or empty: ${ASSET_PATH:-<unset>}"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have a .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="$(cat <<EOF
          ## Automated Debug APK Build

          - **Artifact Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Intended Use:** Intended for testing on Android devices
          - **Distribution Notice:** Not a Google Play Store production release
          - **Signing Notice:** Signed only with a temporary debug keystore

          ### Direct Phone Download
          Under **Assets** below, tap **\`${ASSET_FILENAME}\`** to download the debug APK directly to your Android device.
          EOF
          )"

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest; then
            echo "::warning::GitHub Release creation failed for tag '${RELEASE_TAG}'."
            exit 1
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail

          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "::error::Debug APK build or 'app-debug-apk' artifact upload did not succeed."
            {
              echo "### Debug APK Build Failed"
              echo ""
              echo "The debug APK build or \`app-debug-apk\` artifact upload failed before GitHub Release publishing could complete. Check the workflow logs above for details."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          VERIFIED_RELEASE_URL=""
          if [ "$PUBLISH_OUTCOME" = "success" ] && [ -n "${RELEASE_TAG:-}" ] && command -v gh >/dev/null 2>&1; then
            VERIFIED_RELEASE_URL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq "select(any(.assets[]; .name == \"${ASSET_FILENAME}\")) | .url" 2>/dev/null || true)"
          fi

          if [ -n "$VERIFIED_RELEASE_URL" ]; then
            echo "GitHub Release published successfully!"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${VERIFIED_RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"

            {
              echo "### Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Direct Release Page:** ${VERIFIED_RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo ""
              echo "#### How to Download on Your Phone"
              echo "1. Open the GitHub Release page: ${VERIFIED_RELEASE_URL}"
              echo "2. Scroll to the **Assets** section and tap **\`${ASSET_FILENAME}\`** to download the \`.apk\` file directly."
              echo ""
              echo "> **Backup Download:** The normal GitHub Actions artifact named **\`app-debug-apk\`** is also available on this workflow run summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed, could not be verified, or was skipped."
            echo "The debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "### Warning: GitHub Release Publishing Unavailable"
              echo ""
              echo "GitHub Release creation failed or could not be verified for this run."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Download Available:** Download the **\`app-debug-apk\`** artifact from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
